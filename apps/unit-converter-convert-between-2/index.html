<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Unit Converter — Convert Between Units</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e3a5f, #2c5364);
    color: #f5f7fa; padding: 1rem;
  }
  .card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px; padding: 2rem; width: 100%; max-width: 440px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35); backdrop-filter: blur(8px);
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  p.sub { margin: 0 0 1.5rem; opacity: 0.75; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; opacity: 0.9; }
  input, select {
    width: 100%; padding: 0.7rem 0.8rem; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.25);
    color: #fff; font-size: 1rem; margin-bottom: 1rem;
  }
  .row { display: flex; gap: 0.6rem; align-items: flex-end; }
  .row > div { flex: 1; }
  button {
    width: 100%; padding: 0.8rem; border: none; border-radius: 10px;
    background: #4fc3f7; color: #06243a; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.08); }
  #swap { width: auto; padding: 0.7rem 0.8rem; background: rgba(255,255,255,0.15); color: #fff; margin-bottom: 1rem; }
  #result {
    margin-top: 1.5rem; padding: 1rem; border-radius: 10px;
    background: rgba(79,195,247,0.12); border: 1px solid rgba(79,195,247,0.3);
    min-height: 3rem; font-size: 1.15rem; text-align: center;
  }
  #result strong { font-size: 1.5rem; }
  .err { color: #ff8a80; }
</style>
</head>
<body>
  <main class="card">
    <h1>Unit Converter</h1>
    <p class="sub">Convert between units across length, mass, temperature, volume, time, area, speed, digital storage, electrical (capacitance, inductance, conductance), luminous flux, flow rate and fuel economy.</p>

    <label for="expr">Quick convert</label>
    <div class="row">
      <div><input id="expr" type="text" placeholder="e.g. 10 km to mi" style="margin-bottom:0;" /></div>
      <button id="exprGo" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Go</button>
    </div>
    <div style="height:1rem;"></div>

    <label for="category">Category</label>
    <select id="category"></select>

    <label for="value">Value</label>
    <input id="value" type="number" step="any" value="1" inputmode="decimal" />

    <div class="row">
      <div>
        <label for="from">From</label>
        <select id="from"></select>
      </div>
      <button id="swap" type="button" title="Swap units" aria-label="Swap units">&#8645;</button>
      <div>
        <label for="to">To</label>
        <select id="to"></select>
      </div>
    </div>

    <label style="display:flex;align-items:center;gap:0.5rem;margin:-0.4rem 0 1rem;font-size:0.85rem;opacity:0.9;">
      <input id="deltaMode" type="checkbox" style="width:auto;margin:0;" />
      Treat value as a change / interval (e.g. a 10&deg;C rise &rarr; 18&deg;F rise)
    </label>

    <button id="convert" type="button">Convert</button>
    <button id="convertAll" type="button" style="margin-top:0.6rem;background:rgba(255,255,255,0.15);color:#fff;">Convert to all units</button>
    <button id="humanize" type="button" style="margin-top:0.6rem;background:rgba(255,255,255,0.15);color:#fff;">Auto-scale (humanize)</button>

    <label for="valueB" style="margin-top:0.9rem;">Compare against (value in the “To” unit)</label>
    <div class="row">
      <div><input id="valueB" type="number" step="any" placeholder="e.g. 800" inputmode="decimal" style="margin-bottom:0;" /></div>
      <button id="compare" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Compare</button>
    </div>

    <label for="compoundUnits" style="margin-top:0.9rem;">Breakdown units (comma-separated, e.g. h, min, s)</label>
    <div class="row">
      <div><input id="compoundUnits" type="text" placeholder="e.g. ft, in" style="margin-bottom:0;" /></div>
      <button id="compound" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Break down</button>
    </div>

    <label for="sumExpr" style="margin-top:0.9rem;">Sum a compound / mixed-unit quantity (totalled into the “To” unit)</label>
    <div class="row">
      <div><input id="sumExpr" type="text" placeholder="e.g. 6 ft 2 in" style="margin-bottom:0;" /></div>
      <button id="sum" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Total</button>
    </div>

    <label for="statsExpr" style="margin-top:0.9rem;">Stats over a set of quantities (comma-separated, summarised in the “To” unit)</label>
    <div class="row">
      <div><input id="statsExpr" type="text" placeholder="e.g. 5 m, 300 cm, 2 ft" style="margin-bottom:0;" /></div>
      <button id="stats" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Stats</button>
    </div>

    <label for="describeExpr" style="margin-top:0.9rem;">Describe a set of quantities (median, variance &amp; standard deviation, in the “To” unit)</label>
    <div class="row">
      <div><input id="describeExpr" type="text" placeholder="e.g. 2 m, 4 m, 9 m" style="margin-bottom:0;" /></div>
      <button id="describe" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Describe</button>
    </div>

    <label for="shapeExpr" style="margin-top:0.9rem;">Distribution shape of a set of quantities (skewness &amp; excess kurtosis, in the “To” unit)</label>
    <div class="row">
      <div><input id="shapeExpr" type="text" placeholder="e.g. 1 m, 2 m, 2 m, 9 m" style="margin-bottom:0;" /></div>
      <button id="shape" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Shape</button>
    </div>

    <label for="sortExpr" style="margin-top:0.9rem;">Sort a set of quantities by magnitude (in the “To” unit)</label>
    <div class="row">
      <div><input id="sortExpr" type="text" placeholder="e.g. 5 m, 300 cm, 2 ft" style="margin-bottom:0;" /></div>
      <button id="sortDesc" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Sort &darr;</button>
      <button id="sortAsc" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Sort &uarr;</button>
    </div>

    <label for="cumsumExpr" style="margin-top:0.9rem;">Running (cumulative) total of a set of quantities (in the “To” unit)</label>
    <div class="row">
      <div><input id="cumsumExpr" type="text" placeholder="e.g. 5 km, 3 km, 2 km" style="margin-bottom:0;" /></div>
      <button id="cumsum" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Running total</button>
    </div>

    <label for="percentileExpr" style="margin-top:0.9rem;">Percentile of a set of quantities (0–100, in the “To” unit)</label>
    <div class="row">
      <div><input id="percentileExpr" type="text" placeholder="e.g. 2 m, 4 m, 9 m" style="margin-bottom:0;" /></div>
      <div><input id="percentileP" type="number" min="0" max="100" step="any" placeholder="p (e.g. 90)" aria-label="Percentile rank (0 to 100)" style="margin-bottom:0;" /></div>
      <button id="percentile" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Percentile</button>
    </div>

    <label for="proportionsExpr" style="margin-top:0.9rem;">Each quantity’s share of the group total (fraction &amp; percent, in the “To” unit)</label>
    <div class="row">
      <div><input id="proportionsExpr" type="text" placeholder="e.g. 2 m, 4 m, 6 m" style="margin-bottom:0;" /></div>
      <button id="proportions" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Proportions</button>
    </div>

    <label for="diffExpr" style="margin-top:0.9rem;">Successive differences between a set of quantities (in the “To” unit)</label>
    <div class="row">
      <div><input id="diffExpr" type="text" placeholder="e.g. 10 km, 25 km, 40 km" style="margin-bottom:0;" /></div>
      <button id="diff" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Differences</button>
    </div>

    <label for="zscoreExpr" style="margin-top:0.9rem;">Z-scores of a set of quantities (deviations from the mean, in the “To” unit)</label>
    <div class="row">
      <div><input id="zscoreExpr" type="text" placeholder="e.g. 2 m, 4 m, 9 m" style="margin-bottom:0;" /></div>
      <button id="zscore" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Z-scores</button>
    </div>

    <label for="robustzExpr" style="margin-top:0.9rem;">Robust (modified) z-scores &mdash; median/MAD-based, flags outliers (in the “To” unit)</label>
    <div class="row">
      <div><input id="robustzExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 100 m" style="margin-bottom:0;" /></div>
      <button id="robustz" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Robust z</button>
    </div>

    <label for="normalizeExpr" style="margin-top:0.9rem;">Min-max normalize a set of quantities to [0, 1] (in the “To” unit)</label>
    <div class="row">
      <div><input id="normalizeExpr" type="text" placeholder="e.g. 2 m, 4 m, 6 m" style="margin-bottom:0;" /></div>
      <button id="normalize" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Normalize</button>
    </div>

    <label for="quartilesExpr" style="margin-top:0.9rem;">Five-number summary &amp; IQR of a set of quantities (in the “To” unit)</label>
    <div class="row">
      <div><input id="quartilesExpr" type="text" placeholder="e.g. 1 m, 2 m, 4 m, 7 m, 9 m" style="margin-bottom:0;" /></div>
      <button id="quartiles" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Quartiles</button>
    </div>

    <label for="outliersExpr" style="margin-top:0.9rem;">Flag outliers by Tukey IQR fences (in the “To” unit)</label>
    <div class="row">
      <div><input id="outliersExpr" type="text" placeholder="e.g. 10 m, 11 m, 12 m, 90 m" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="outliersK" type="number" step="0.1" min="0" placeholder="k=1.5" title="IQR multiplier (default 1.5)" style="margin-bottom:0;width:6rem;" /></div>
      <button id="outliers" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Outliers</button>
    </div>

    <label for="histogramExpr" style="margin-top:0.9rem;">Histogram of a set of quantities into equal-width bins (in the “To” unit)</label>
    <div class="row">
      <div><input id="histogramExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m, 5 m" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="histogramBins" type="number" step="1" min="1" placeholder="bins=4" title="number of bins" style="margin-bottom:0;width:6rem;" /></div>
      <button id="histogram" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Histogram</button>
    </div>

    <label for="meansExpr" style="margin-top:0.9rem;">Four classical means — arithmetic, geometric, harmonic, RMS (in the “To” unit)</label>
    <div class="row">
      <div><input id="meansExpr" type="text" placeholder="e.g. 1 m, 2 m, 4 m, 8 m" style="margin-bottom:0;" /></div>
      <button id="means" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Means</button>
    </div>

    <label for="rankExpr" style="margin-top:0.9rem;">Rank &amp; percentile rank of each quantity (in the “To” unit)</label>
    <div class="row">
      <div><input id="rankExpr" type="text" placeholder="e.g. 5 m, 1 m, 3 m, 2 m, 4 m" style="margin-bottom:0;" /></div>
      <button id="rankDesc" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Rank &darr;</button>
      <button id="rankAsc" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Rank &uarr;</button>
    </div>

    <label for="modeExpr" style="margin-top:0.9rem;">Mode — the most frequent quantity / quantities (in the “To” unit)</label>
    <div class="row">
      <div><input id="modeExpr" type="text" placeholder="e.g. 1 m, 2 m, 2 m, 3 m" style="margin-bottom:0;" /></div>
      <button id="mode" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Mode</button>
    </div>

    <label for="weightedExpr" style="margin-top:0.9rem;">Weighted mean — append <code>*weight</code> to a quantity (in the “To” unit)</label>
    <div class="row">
      <div><input id="weightedExpr" type="text" placeholder="e.g. 1 m*1, 3 m*3" style="margin-bottom:0;" /></div>
      <button id="weighted" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Weighted mean</button>
    </div>

    <label for="movingExpr" style="margin-top:0.9rem;">Moving average — rolling mean over a window of N items (in the “To” unit)</label>
    <div class="row">
      <div><input id="movingExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="movingWindow" type="number" step="1" min="1" placeholder="window=2" title="window size" style="margin-bottom:0;width:7rem;" /></div>
      <button id="moving" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Moving avg</button>
    </div>

    <label for="emaExpr" style="margin-top:0.9rem;">Exponential moving average — smoothing that weights recent items more (alpha in (0,1], default 0.5)</label>
    <div class="row">
      <div><input id="emaExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="emaAlpha" type="number" step="any" min="0" max="1" placeholder="alpha=0.5" title="smoothing factor in (0, 1]" style="margin-bottom:0;width:7rem;" /></div>
      <button id="ema" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">EMA</button>
    </div>

    <label for="acfExpr" style="margin-top:0.9rem;">Autocorrelation — how much each reading resembles one k steps earlier (lag 0 is always 1; maxlag defaults to count−1)</label>
    <div class="row">
      <div><input id="acfExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m, 5 m" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="acfMaxlag" type="number" step="1" min="0" placeholder="maxlag" title="largest lag to report (0..count-1)" style="margin-bottom:0;width:7rem;" /></div>
      <button id="acf" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">ACF</button>
    </div>

    <label for="ciExpr" style="margin-top:0.9rem;">Confidence interval for the mean — mean ± margin via the normal (z) approximation (confidence in (0,1), default 0.95)</label>
    <div class="row">
      <div><input id="ciExpr" type="text" placeholder="e.g. 10 m, 12 m, 14 m, 16 m, 18 m" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="ciConf" type="number" step="any" min="0" max="1" placeholder="0.95" title="confidence level in (0, 1)" style="margin-bottom:0;width:7rem;" /></div>
      <button id="ci" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">CI</button>
    </div>

    <label for="tiExpr" style="margin-top:0.9rem;">Student's t interval for the mean — small-sample CI using the exact t critical value (df = n−1); wider than the z CI for small n (confidence in (0,1), default 0.95)</label>
    <div class="row">
      <div><input id="tiExpr" type="text" placeholder="e.g. 10 m, 12 m, 14 m, 16 m, 18 m" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="tiConf" type="number" step="any" min="0" max="1" placeholder="0.95" title="confidence level in (0, 1)" style="margin-bottom:0;width:7rem;" /></div>
      <button id="ti" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">t-CI</button>
    </div>

    <label for="ostExpr" style="margin-top:0.9rem;">One-sample t-test — does the sample mean differ from a hypothesized value μ (in the target unit, default 0)? The one-group sibling of the t-test, t-CI and confidence interval (small p rejects)</label>
    <div class="row">
      <div><input id="ostExpr" type="text" placeholder="e.g. 10 m, 12 m, 14 m, 16 m, 18 m" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="ostMu" type="number" step="any" placeholder="μ = 0" title="hypothesized mean in the target unit (default 0)" style="margin-bottom:0;width:7rem;" /></div>
      <div style="flex:0 0 auto;"><input id="ostAlpha" type="number" step="any" min="0" max="1" placeholder="α = 0.05" title="significance level in (0, 1)" style="margin-bottom:0;width:7rem;" /></div>
      <button id="ost" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">1-sample t</button>
    </div>

    <label for="gofObs" style="margin-top:0.9rem;">Chi-square goodness-of-fit — do observed category counts follow an expected distribution? Counts are bare numbers (no units). Leave "expected" blank for a uniform null, or give matching weights/proportions (small p rejects)</label>
    <div class="row">
      <div><input id="gofObs" type="text" placeholder="observed, e.g. 18, 22, 20, 16, 24, 20" style="margin-bottom:0;" /></div>
      <div><input id="gofExp" type="text" placeholder="expected (optional), e.g. 1, 1, 1, 1, 1, 1" style="margin-bottom:0;" /></div>
      <div style="flex:0 0 auto;"><input id="gofDdof" type="number" step="1" min="0" placeholder="ddof = 0" title="parameters estimated from the data (lowers df)" style="margin-bottom:0;width:7rem;" /></div>
      <div style="flex:0 0 auto;"><input id="gofAlpha" type="number" step="any" min="0" max="1" placeholder="α = 0.05" title="significance level in (0, 1)" style="margin-bottom:0;width:7rem;" /></div>
      <button id="gof" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">χ² GOF</button>
    </div>

    <label for="jbExpr" style="margin-top:0.9rem;">Jarque-Bera normality test — is the sample shape (skew + kurtosis) consistent with a normal distribution? (small p rejects)</label>
    <div class="row">
      <div><input id="jbExpr" type="text" placeholder="e.g. 10 m, 12 m, 14 m, 16 m, 18 m" style="margin-bottom:0;" /></div>
      <button id="jb" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">JB</button>
    </div>

    <label for="anovaExpr" style="margin-top:0.9rem;">One-way ANOVA (F-test) — do three-or-more groups share the same mean? Separate groups with ';' (small p rejects)</label>
    <div class="row">
      <div><input id="anovaExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m ; 4 m, 5 m, 6 m ; 7 m, 8 m, 9 m" style="margin-bottom:0;" /></div>
      <button id="anova" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">ANOVA</button>
    </div>

    <label for="kruskalExpr" style="margin-top:0.9rem;">Kruskal-Wallis H test — the rank-based (non-normal) ANOVA: do k groups share one distribution? Separate groups with ';' (small p rejects)</label>
    <div class="row">
      <div><input id="kruskalExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m ; 4 m, 5 m, 6 m ; 7 m, 8 m, 9 m" style="margin-bottom:0;" /></div>
      <button id="kruskal" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Kruskal-Wallis</button>
    </div>

    <label for="bartlettExpr" style="margin-top:0.9rem;">Bartlett's test — do k groups share one variance? (the homogeneity-of-variances pre-check behind ANOVA). Separate groups with ';' (small p rejects equal spread)</label>
    <div class="row">
      <div><input id="bartlettExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m ; 2 m, 4 m, 6 m, 8 m ; 1 m, 1 m, 1 m, 2 m" style="margin-bottom:0;" /></div>
      <button id="bartlett" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Bartlett</button>
    </div>

    <label for="leveneExpr" style="margin-top:0.9rem;">Levene's test — do k groups share one variance? The robust alternative to Bartlett (centres on each group's mean, or median for Brown&ndash;Forsythe). Separate groups with ';' (small p rejects equal spread)</label>
    <div class="row">
      <div><input id="leveneExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m ; 2 m, 4 m, 6 m, 8 m ; 1 m, 1 m, 1 m, 2 m" style="margin-bottom:0;" /></div>
      <select id="leveneCenter" style="width:auto;margin-bottom:0;">
        <option value="mean">mean</option>
        <option value="median">median</option>
      </select>
      <button id="levene" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Levene</button>
    </div>

    <label for="signExpr" style="margin-top:0.9rem;">Sign test — the assumption-free paired test: did the median shift? Uses only the direction of each before/after change. Separate the two paired series with ';' (small p rejects)</label>
    <div class="row">
      <div><input id="signExpr" type="text" placeholder="e.g. 5 m, 6 m, 7 m, 8 m ; 4 m, 5 m, 6 m, 9 m" style="margin-bottom:0;" /></div>
      <button id="sign" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Sign test</button>
    </div>

    <label for="cohensExpr" style="margin-top:0.9rem;">Cohen's d effect size — how big is the gap between two samples' means (in pooled-stdev units)? Separate the two samples with ';'</label>
    <div class="row">
      <div><input id="cohensExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m, 5 m ; 6 m, 7 m, 8 m, 9 m, 10 m" style="margin-bottom:0;" /></div>
      <button id="cohens" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Cohen's d</button>
    </div>

    <label for="fTestExpr" style="margin-top:0.9rem;">F-test for equal variances — are two samples equally spread out (the pooled-vs-Welch t-test pre-check)? Separate the two samples with ';'</label>
    <div class="row">
      <div><input id="fTestExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m, 5 m ; 2 m, 4 m, 6 m, 8 m, 10 m" style="margin-bottom:0;" /></div>
      <button id="fTest" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">F-test</button>
    </div>

    <label for="giniExpr" style="margin-top:0.9rem;">Gini inequality coefficient — how evenly the total is shared (0 = equal, →1 = concentrated)</label>
    <div class="row">
      <div><input id="giniExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m" style="margin-bottom:0;" /></div>
      <button id="gini" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Gini</button>
    </div>

    <label for="lorenzExpr" style="margin-top:0.9rem;">Lorenz curve — cumulative share of the total held by the smallest k% (the shape behind the Gini)</label>
    <div class="row">
      <div><input id="lorenzExpr" type="text" placeholder="e.g. 1 m, 2 m, 3 m, 4 m" style="margin-bottom:0;" /></div>
      <button id="lorenz" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Lorenz</button>
    </div>

    <label for="trimExpr" style="margin-top:0.9rem;">Trimmed &amp; winsorized mean — robust average that resists outliers (proportion trimmed per tail)</label>
    <div class="row">
      <div><input id="trimExpr" type="text" placeholder="e.g. 10 m, 11 m, 12 m, 13 m, 1000 m" style="margin-bottom:0;" /></div>
      <div><input id="trimProp" type="number" step="0.05" min="0" max="0.49" placeholder="0.1" aria-label="Proportion trimmed per tail" style="margin-bottom:0;width:5rem;" /></div>
      <button id="trim" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Trimmed</button>
    </div>

    <label for="winsorExpr" style="margin-top:0.9rem;">Winsorize &mdash; clamp the extreme values to the trim bounds, returning the whole transformed series (proportion clamped per tail)</label>
    <div class="row">
      <div><input id="winsorExpr" type="text" placeholder="e.g. 10 m, 11 m, 12 m, 13 m, 1000 m" style="margin-bottom:0;" /></div>
      <div><input id="winsorProp" type="number" step="0.05" min="0" max="0.49" placeholder="0.1" aria-label="Proportion clamped per tail" style="margin-bottom:0;width:5rem;" /></div>
      <button id="winsorize" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Winsorize</button>
    </div>

    <label for="spearmanX" style="margin-top:0.9rem;">Spearman rank correlation — monotonic association between two paired series (−1…1)</label>
    <div class="row">
      <div><input id="spearmanX" type="text" placeholder="x: e.g. 1 m, 2 m, 3 m, 4 m" style="margin-bottom:0;" /></div>
      <div><input id="spearmanY" type="text" placeholder="y: e.g. 1 s, 4 s, 9 s, 16 s" aria-label="Spearman y series" style="margin-bottom:0;" /></div>
      <button id="spearman" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Spearman</button>
    </div>

    <label for="kendallX" style="margin-top:0.9rem;">Kendall&rsquo;s &tau; rank correlation — concordance of every pair of two series (−1…1)</label>
    <div class="row">
      <div><input id="kendallX" type="text" placeholder="x: e.g. 1 m, 2 m, 3 m, 4 m" style="margin-bottom:0;" /></div>
      <div><input id="kendallY" type="text" placeholder="y: e.g. 1 s, 4 s, 9 s, 16 s" aria-label="Kendall y series" style="margin-bottom:0;" /></div>
      <button id="kendall" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Kendall</button>
    </div>

    <label for="theilsenX" style="margin-top:0.9rem;">Theil&ndash;Sen robust fit &mdash; outlier-resistant line (median of pairwise slopes)</label>
    <div class="row">
      <div><input id="theilsenX" type="text" placeholder="x: e.g. 1 m, 2 m, 3 m, 4 m, 5 m" style="margin-bottom:0;" /></div>
      <div><input id="theilsenY" type="text" placeholder="y: e.g. 2 s, 4 s, 6 s, 8 s, 100 s" aria-label="Theil–Sen y series" style="margin-bottom:0;" /></div>
      <button id="theilsen" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Theil&ndash;Sen</button>
    </div>

    <label for="residualsX" style="margin-top:0.9rem;">Residuals &mdash; the least-squares line evaluated at every point (fitted, residual, R&sup2;)</label>
    <div class="row">
      <div><input id="residualsX" type="text" placeholder="x: e.g. 1 m, 2 m, 3 m, 4 m, 5 m" style="margin-bottom:0;" /></div>
      <div><input id="residualsY" type="text" placeholder="y: e.g. 2 s, 4 s, 5 s, 4 s, 5 s" aria-label="Residuals y series" style="margin-bottom:0;" /></div>
      <button id="residuals" type="button" style="width:auto;padding:0.7rem 0.9rem;background:rgba(255,255,255,0.15);color:#fff;margin-bottom:0;">Residuals</button>
    </div>

    <div id="result" role="status" aria-live="polite" style="margin-top:1.5rem;">Pick units and press Convert.</div>
    <div id="allResults"></div>
  </main>

<script>
  const categoryEl = document.getElementById("category");
  const valueEl = document.getElementById("value");
  const fromEl = document.getElementById("from");
  const toEl = document.getElementById("to");
  const resultEl = document.getElementById("result");

  let UNITS = {};

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch];
    });
  }

  function fillSelect(sel, units, selectedIndex) {
    sel.innerHTML = "";
    units.forEach(function (u, i) {
      const opt = document.createElement("option");
      opt.value = u;
      opt.textContent = u;
      if (i === selectedIndex) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function onCategoryChange() {
    const units = UNITS[categoryEl.value] || [];
    fillSelect(fromEl, units, 0);
    fillSelect(toEl, units, units.length > 1 ? 1 : 0);
  }

  async function loadUnits() {
    try {
      const resp = await fetch("/api/units");
      const data = await resp.json();
      UNITS = data.categories || {};
      Object.keys(UNITS).forEach(function (cat) {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        categoryEl.appendChild(opt);
      });
      onCategoryChange();
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Could not load units.</span>';
    }
  }

  async function convert() {
    const value = valueEl.value;
    if (value === "" || value === null) {
      resultEl.innerHTML = '<span class="err">Please enter a value.</span>';
      return;
    }
    const delta = document.getElementById("deltaMode").checked;
    const endpoint = delta ? "/api/convert-delta" : "/api/convert";
    try {
      const resp = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value: value, from: fromEl.value, to: toEl.value }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Conversion failed") + "</span>";
        return;
      }
      const tag = delta ? " <span style=\"opacity:0.7;font-size:0.85rem;\">(interval)</span>" : "";
      resultEl.innerHTML =
        escapeHtml(data.input) + " " + escapeHtml(data.from) + " = <strong>" +
        escapeHtml(data.result) + " " + escapeHtml(data.to) + "</strong>" + tag;
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  const allResultsEl = document.getElementById("allResults");

  async function sumCompound() {
    const expr = document.getElementById("sumExpr").value;
    if (!expr || !expr.trim()) {
      resultEl.innerHTML = '<span class="err">Type a compound quantity, e.g. "6 ft 2 in".</span>';
      return;
    }
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/parse-compound", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ expression: expr, to: toEl.value }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Sum failed") + "</span>";
        return;
      }
      const parts = data.parts.map(function (p) { return p.value + " " + p.unit; }).join(" + ");
      resultEl.innerHTML =
        parts + " = <strong>" + data.total + " " + data.unit + "</strong>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function convertAll() {
    const value = valueEl.value;
    if (value === "" || value === null) {
      resultEl.innerHTML = '<span class="err">Please enter a value.</span>';
      return;
    }
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/convert-all", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value: value, from: fromEl.value }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Conversion failed") + "</span>";
        return;
      }
      resultEl.innerHTML = data.input + " " + data.from + " in every " + data.category + " unit:";
      const rows = data.results.map(function (r) {
        return '<div style="display:flex;justify-content:space-between;padding:0.2rem 0;">' +
          '<span style="opacity:0.8;">' + r.unit + '</span><strong>' + r.result + '</strong></div>';
      }).join("");
      allResultsEl.innerHTML =
        '<div style="margin-top:0.8rem;padding:0.8rem;border-radius:10px;' +
        'background:rgba(79,195,247,0.08);border:1px solid rgba(79,195,247,0.25);">' + rows + '</div>';
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function quickConvert() {
    const expr = document.getElementById("expr").value;
    if (!expr || !expr.trim()) {
      resultEl.innerHTML = '<span class="err">Type something like "10 km to mi".</span>';
      return;
    }
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/parse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ expression: expr }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Conversion failed") + "</span>";
        return;
      }
      resultEl.innerHTML =
        data.input + " " + data.from + " = <strong>" + data.result + " " + data.to + "</strong>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function humanize() {
    const value = valueEl.value;
    if (value === "" || value === null) {
      resultEl.innerHTML = '<span class="err">Please enter a value.</span>';
      return;
    }
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/humanize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value: value, from: fromEl.value }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Auto-scale failed") + "</span>";
        return;
      }
      resultEl.innerHTML =
        data.input + " " + data.from + " = <strong>" + data.value + " " + data.unit + "</strong>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function compound() {
    const value = valueEl.value;
    if (value === "" || value === null) {
      resultEl.innerHTML = '<span class="err">Please enter a value.</span>';
      return;
    }
    const raw = document.getElementById("compoundUnits").value || "";
    const units = raw.split(",").map(function (u) { return u.trim(); }).filter(Boolean);
    if (units.length === 0) {
      resultEl.innerHTML = '<span class="err">List the units to break down into, e.g. "h, min, s".</span>';
      return;
    }
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/compound", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value: value, from: fromEl.value, units: units }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Breakdown failed") + "</span>";
        return;
      }
      resultEl.innerHTML =
        data.input + " " + data.from + " = <strong>" + data.formatted + "</strong>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function compare() {
    const value = valueEl.value;
    const valueB = document.getElementById("valueB").value;
    if (value === "" || value === null || valueB === "" || valueB === null) {
      resultEl.innerHTML = '<span class="err">Enter both the value and the comparison value.</span>';
      return;
    }
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/compare", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          a: { value: value, unit: fromEl.value },
          b: { value: valueB, unit: toEl.value },
        }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Compare failed") + "</span>";
        return;
      }
      const rel = data.larger === "equal"
        ? "equal to"
        : (data.larger === "a" ? "larger than" : "smaller than");
      resultEl.innerHTML =
        "<strong>" + data.a.value + " " + data.a.unit + "</strong> is " + rel +
        " <strong>" + data.b.value + " " + data.b.unit + "</strong>" +
        '<div style="margin-top:0.5rem;opacity:0.85;font-size:0.95rem;">' +
        data.a.value + " " + data.a.unit + " = " + data.a_in_b_unit + " " + data.b.unit +
        (data.ratio !== null ? " &middot; ratio " + data.ratio + "&times;" : "") + "</div>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function stats() {
    const raw = document.getElementById("statsExpr").value || "";
    const chunks = raw.split(",").map(function (c) { return c.trim(); }).filter(Boolean);
    if (chunks.length === 0) {
      resultEl.innerHTML = '<span class="err">List some quantities, e.g. "5 m, 300 cm, 2 ft".</span>';
      return;
    }
    const items = [];
    for (let i = 0; i < chunks.length; i++) {
      const m = chunks[i].match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\s*(.+)$/);
      if (!m) {
        resultEl.innerHTML = '<span class="err">Could not read "' + chunks[i] + '" — use "&lt;number&gt; &lt;unit&gt;".</span>';
        return;
      }
      items.push({ value: m[1], unit: m[2].trim() });
    }
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/stats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: items, to: toEl.value }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Stats failed") + "</span>";
        return;
      }
      const u = " " + data.unit;
      resultEl.innerHTML =
        "<strong>" + data.count + "</strong> " + data.category + " quantities in " + data.unit +
        '<div style="margin-top:0.5rem;opacity:0.9;font-size:0.95rem;text-align:left;">' +
        "sum " + data.sum + u + " &middot; mean " + data.mean + u + "<br>" +
        "min " + data.min.value + u + " (#" + (data.min.index + 1) + ") &middot; " +
        "max " + data.max.value + u + " (#" + (data.max.index + 1) + ")<br>" +
        "range " + data.range + u + "</div>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  // Parse a comma-separated "5 m, 300 cm, 2 ft" string into [{value, unit}].
  // Returns null and renders an error when an entry cannot be read.
  function parseQuantityList(raw) {
    const chunks = (raw || "").split(",").map(function (c) { return c.trim(); }).filter(Boolean);
    if (chunks.length === 0) {
      resultEl.innerHTML = '<span class="err">List some quantities, e.g. "5 m, 300 cm, 2 ft".</span>';
      return null;
    }
    const items = [];
    for (let i = 0; i < chunks.length; i++) {
      const m = chunks[i].match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\s*(.+)$/);
      if (!m) {
        resultEl.innerHTML = '<span class="err">Could not read "' + chunks[i] + '" — use "&lt;number&gt; &lt;unit&gt;".</span>';
        return null;
      }
      items.push({ value: m[1], unit: m[2].trim() });
    }
    return items;
  }

  async function describe() {
    const items = parseQuantityList(document.getElementById("describeExpr").value);
    if (!items) return;
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/describe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: items, to: toEl.value }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Describe failed") + "</span>";
        return;
      }
      const u = " " + data.unit;
      const sample = (data.sample_stdev === null) ? "n/a" : (data.sample_stdev + u);
      resultEl.innerHTML =
        "<strong>" + data.count + "</strong> " + data.category + " quantities in " + data.unit +
        '<div style="margin-top:0.5rem;opacity:0.9;font-size:0.95rem;text-align:left;">' +
        "mean " + data.mean + u + " &middot; median " + data.median + u + "<br>" +
        "variance " + data.variance + " &middot; std dev (pop.) " + data.stdev + u + "<br>" +
        "std dev (sample) " + sample + "<br>" +
        "min " + data.min.value + u + " &middot; max " + data.max.value + u + "</div>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function shape() {
    const items = parseQuantityList(document.getElementById("shapeExpr").value);
    if (!items) return;
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/shape", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: items, to: toEl.value }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Shape failed") + "</span>";
        return;
      }
      const u = " " + data.unit;
      const fmt = function (v) { return v === null ? "n/a" : v; };
      resultEl.innerHTML =
        "<strong>" + data.count + "</strong> " + data.category + " quantities in " + data.unit +
        '<div style="margin-top:0.5rem;opacity:0.9;font-size:0.95rem;text-align:left;">' +
        "mean " + data.mean + u + " &middot; std dev (pop.) " + data.stdev + u + "<br>" +
        "skewness " + fmt(data.skewness) + " &middot; sample " + fmt(data.sample_skewness) + "<br>" +
        "excess kurtosis " + fmt(data.kurtosis) + " &middot; sample " + fmt(data.sample_kurtosis) + "</div>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function sortQuantities(descending) {
    const items = parseQuantityList(document.getElementById("sortExpr").value);
    if (!items) return;
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/sort", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: items, to: toEl.value, descending: descending }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Sort failed") + "</span>";
        return;
      }
      const ordered = data.items.map(function (r) { return r.value + " " + data.unit + " (#" + (r.index + 1) + ")"; }).join(" &le; ");
      resultEl.innerHTML =
        "<strong>" + data.count + "</strong> " + data.category + " quantities, " +
        (data.descending ? "largest first" : "smallest first") +
        '<div style="margin-top:0.5rem;opacity:0.9;font-size:0.95rem;text-align:left;">' + ordered + "</div>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function cumsum() {
    const items = parseQuantityList(document.getElementById("cumsumExpr").value);
    if (!items) return;
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/cumsum", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: items, to: toEl.value }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Running total failed") + "</span>";
        return;
      }
      const steps = data.items.map(function (r) {
        return "#" + (r.index + 1) + ": +" + r.value + " &rarr; " + r.cumulative + " " + data.unit;
      }).join("<br>");

  // Parse "1 m*1, 3 m*3" — each chunk is a quantity with an optional *weight.
  function parseWeightedList(raw) {
    const chunks = (raw || "").split(",").map(function (c) { return c.trim(); }).filter(Boolean);
    if (chunks.length === 0) {
      resultEl.innerHTML = '<span class="err">List some quantities, e.g. "1 m*1, 3 m*3".</span>';
      return null;
    }
    const items = [];
    for (let i = 0; i < chunks.length; i++) {
      const star = chunks[i].lastIndexOf("*");
      let qty = chunks[i], weight = null;
      if (star !== -1) {
        qty = chunks[i].slice(0, star).trim();
        weight = chunks[i].slice(star + 1).trim();
      }
      const m = qty.match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)\s*(.+)$/);
      if (!m) {
        resultEl.innerHTML = '<span class="err">Could not read "' + chunks[i] + '" — use "&lt;number&gt; &lt;unit&gt;*&lt;weight&gt;".</span>';
        return null;
      }
      const item = { value: m[1], unit: m[2].trim() };
      if (weight !== null && weight !== "") item.weight = Number(weight);
      items.push(item);
    }
    return items;
  }

  function parseNumberList(raw) {
    // Bare, dimensionless numbers separated by commas/whitespace (the χ² GOF
    // counts and expected weights carry no units). Returns null on any
    // non-numeric token so the caller can surface an error, [] for empty input.
    const text = (raw || "").trim();
    if (!text) return [];
    const tokens = text.split(/[\s,]+/).filter(function (t) { return t.length; });
    const out = [];
    for (const tok of tokens) {
      const n = Number(tok);
      if (!isFinite(n)) return null;
      out.push(n);
    }
    return out;
  }

      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  async function theilsen() {
    const x = parseQuantityList(document.getElementById("theilsenX").value);
    if (!x) return;
    const y = parseQuantityList(document.getElementById("theilsenY").value);
    if (!y) return;
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/theil-sen", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ x: x, y: y }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Theil-Sen failed") + "</span>";
        return;
      }
      const sign = data.intercept < 0 ? "&minus; " + Math.abs(data.intercept) : "+ " + data.intercept;
      resultEl.innerHTML =
        "<strong>y = " + data.slope + "&middot;x " + sign + "</strong>" +
        '<div style="margin-top:0.5rem;opacity:0.9;font-size:0.95rem;text-align:left;">' +
        "slope in " + data.y_unit + "/" + data.x_unit + ", intercept in " + data.y_unit + "<br>" +
        data.count + " paired points &middot; " + data.used_pairs + " of " + data.pairs +
        " pairs used" + (data.tied_pairs ? " (" + data.tied_pairs + " tied x skipped)" : "") + "<br>" +
        "median x " + data.median_x + " " + data.x_unit + ", median y " + data.median_y + " " + data.y_unit +
        " &middot; robust to ~29% outliers</div>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }

  document.getElementById("theilsen").addEventListener("click", theilsen);
  document.getElementById("theilsenX").addEventListener("keydown", function (e) { if (e.key === "Enter") theilsen(); });
  document.getElementById("theilsenY").addEventListener("keydown", function (e) { if (e.key === "Enter") theilsen(); });

  async function residuals() {
    const x = parseQuantityList(document.getElementById("residualsX").value);
    if (!x) return;
    const y = parseQuantityList(document.getElementById("residualsY").value);
    if (!y) return;
    allResultsEl.innerHTML = "";
    try {
      const resp = await fetch("/api/residuals", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ x: x, y: y }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        resultEl.innerHTML = '<span class="err">' + (data.error || "Residuals failed") + "</span>";
        return;
      }
      const sign = data.intercept < 0 ? "&minus; " + Math.abs(data.intercept) : "+ " + data.intercept;
      const rse = data.residual_std_error === null ? "n/a" : data.residual_std_error + " " + data.y_unit;
      const r2 = data.r_squared === null ? "n/a" : data.r_squared;
      const rows = data.items.map(function (it) {
        return "<tr><td>" + it.index + "</td><td>" + it.x + " " + data.x_unit +
          "</td><td>" + it.y + " " + data.y_unit + "</td><td>" + it.fitted +
          "</td><td>" + it.residual + "</td></tr>";
      }).join("");
      resultEl.innerHTML =
        "<strong>y = " + data.slope + "&middot;x " + sign + "</strong>" +
        '<div style="margin-top:0.5rem;opacity:0.9;font-size:0.95rem;text-align:left;">' +
        "R&sup2; " + r2 + " &middot; residual std error " + rse + "<br>" +
        "SST " + data.sst + " = SSR " + data.ssr + " + SSE " + data.sse + "</div>" +
        '<table style="margin-top:0.6rem;width:100%;font-size:0.9rem;border-collapse:collapse;">' +
        "<tr><th>#</th><th>x</th><th>y</th><th>fitted</th><th>residual</th></tr>" +
        rows + "</table>";
    } catch (e) {
      resultEl.innerHTML = '<span class="err">Network error.</span>';
    }
  }
