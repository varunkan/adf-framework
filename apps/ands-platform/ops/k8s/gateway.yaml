# API gateway / BFF — the single external entry point.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ands
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ands-platform/gateway:latest
          env:
            - { name: COLLAB_URL, value: http://collaboration:8000 }
            - { name: DOSSIER_URL, value: http://dossier:8000 }
            - { name: VALIDATION_URL, value: http://validation:8000 }
            - { name: IDENTITY_URL, value: http://identity:8000 }
            - { name: LIFECYCLE_URL, value: http://lifecycle:8000 }
            - { name: FEES_URL, value: http://fees:8000 }
            - { name: TRANSMISSION_URL, value: http://transmission:8000 }
            - { name: GOVERNANCE_URL, value: http://governance:8000 }
            - { name: READINESS_URL, value: http://readiness:8000 }
            - { name: REGISTRY_URL, value: http://registry:8000 }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ands
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000 }]
