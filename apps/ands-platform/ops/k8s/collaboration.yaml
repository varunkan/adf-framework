# Reference pattern for a stateful service: its own Postgres + the FastAPI app.
# Replicate this file (swap name/image/DB) for dossier, validation, identity,
# lifecycle, transmission, governance, readiness, registry. (fees is stateless —
# no DB block, ANDS_DB_BACKEND unset.)
apiVersion: v1
kind: Secret
metadata:
  name: collaboration-db
  namespace: ands
type: Opaque
stringData:
  POSTGRES_USER: ands
  POSTGRES_PASSWORD: ands
  POSTGRES_DB: collaboration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collaboration-db
  namespace: ands
spec:
  replicas: 1
  selector:
    matchLabels: { app: collaboration-db }
  template:
    metadata:
      labels: { app: collaboration-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom: [{ secretRef: { name: collaboration-db } }]
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          emptyDir: {}   # demo only — use a PVC / StatefulSet in production
---
apiVersion: v1
kind: Service
metadata:
  name: collaboration-db
  namespace: ands
spec:
  selector: { app: collaboration-db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collaboration
  namespace: ands
spec:
  replicas: 2
  selector:
    matchLabels: { app: collaboration }
  template:
    metadata:
      labels: { app: collaboration }
    spec:
      containers:
        - name: collaboration
          image: ands-platform/collaboration:latest
          env:
            - { name: ANDS_DB_BACKEND, value: postgres }
            - { name: ANDS_PG_DSN, value: postgresql://ands:ands@collaboration-db:5432/collaboration }
            - { name: ANDS_BUS, value: redis }
            - { name: ANDS_REDIS_URL, value: redis://redis:6379/0 }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: collaboration
  namespace: ands
spec:
  selector: { app: collaboration }
  ports: [{ port: 8000, targetPort: 8000 }]
