# ANDS platform — local mesh: per-service Postgres, a Redis event bus,
# the first service (collaboration) and the API gateway.
# Build context is this directory so each image can COPY the shared kernel (libs/).
#
#   docker compose up --build
#   curl localhost:8080/gateway/health
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  collaboration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: collaboration
    volumes:
      - collaboration-pg:/var/lib/postgresql/data

  collaboration:
    build:
      context: .
      dockerfile: services/collaboration/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@collaboration-db:5432/collaboration
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [collaboration-db, redis]
    expose: ["8000"]

  dossier-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: dossier
    volumes:
      - dossier-pg:/var/lib/postgresql/data

  dossier:
    build:
      context: .
      dockerfile: services/dossier/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@dossier-db:5432/dossier
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [dossier-db, redis]
    expose: ["8000"]

  validation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: validation
    volumes:
      - validation-pg:/var/lib/postgresql/data

  validation:
    build:
      context: .
      dockerfile: services/validation/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@validation-db:5432/validation
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [validation-db, redis]
    expose: ["8000"]

  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: identity
    volumes:
      - identity-pg:/var/lib/postgresql/data

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@identity-db:5432/identity
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
      ANDS_OWNER_EMAIL: owner@ands.platform
      ANDS_OWNER_PASSWORD: change-me
    depends_on: [identity-db, redis]
    expose: ["8000"]

  lifecycle-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: lifecycle
    volumes:
      - lifecycle-pg:/var/lib/postgresql/data

  lifecycle:
    build:
      context: .
      dockerfile: services/lifecycle/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@lifecycle-db:5432/lifecycle
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [lifecycle-db, redis]
    expose: ["8000"]

  # fees is stateless — no Postgres.
  fees:
    build:
      context: .
      dockerfile: services/fees/Dockerfile
    expose: ["8000"]

  transmission-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: transmission
    volumes:
      - transmission-pg:/var/lib/postgresql/data

  transmission:
    build:
      context: .
      dockerfile: services/transmission/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@transmission-db:5432/transmission
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [transmission-db, redis]
    expose: ["8000"]

  governance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: governance
    volumes:
      - governance-pg:/var/lib/postgresql/data

  governance:
    build:
      context: .
      dockerfile: services/governance/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@governance-db:5432/governance
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [governance-db, redis]
    expose: ["8000"]

  readiness-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: readiness
    volumes:
      - readiness-pg:/var/lib/postgresql/data

  readiness:
    build:
      context: .
      dockerfile: services/readiness/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@readiness-db:5432/readiness
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [readiness-db, redis]
    expose: ["8000"]

  registry-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: registry
    volumes:
      - registry-pg:/var/lib/postgresql/data

  registry:
    build:
      context: .
      dockerfile: services/registry/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@registry-db:5432/registry
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [registry-db, redis]
    expose: ["8000"]

  webhooks-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: webhooks
    volumes:
      - webhooks-pg:/var/lib/postgresql/data

  webhooks:
    build:
      context: .
      dockerfile: services/webhooks/Dockerfile
    environment:
      ANDS_DB_BACKEND: postgres
      ANDS_PG_DSN: postgresql://ands:ands@webhooks-db:5432/webhooks
      ANDS_BUS: redis
      ANDS_REDIS_URL: redis://redis:6379/0
    depends_on: [webhooks-db, redis]
    expose: ["8000"]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      COLLAB_URL: http://collaboration:8000
      DOSSIER_URL: http://dossier:8000
      VALIDATION_URL: http://validation:8000
      IDENTITY_URL: http://identity:8000
      LIFECYCLE_URL: http://lifecycle:8000
      FEES_URL: http://fees:8000
      TRANSMISSION_URL: http://transmission:8000
      GOVERNANCE_URL: http://governance:8000
      READINESS_URL: http://readiness:8000
      REGISTRY_URL: http://registry:8000
      WEBHOOKS_URL: http://webhooks:8000
    depends_on: [collaboration, dossier, validation, identity, lifecycle, fees,
                 transmission, governance, readiness, registry, webhooks]
    ports: ["8080:8000"]

volumes:
  collaboration-pg:
  dossier-pg:
  validation-pg:
  identity-pg:
  lifecycle-pg:
  transmission-pg:
  governance-pg:
  readiness-pg:
  registry-pg:
  webhooks-pg:
