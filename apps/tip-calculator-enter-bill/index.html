<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         background: #f2f4f7; margin: 0; padding: 40px; color: #1a1a2e; }
  .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 12px;
          padding: 28px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
  h1 { margin: 0 0 20px; font-size: 22px; }
  label { display: block; font-size: 14px; margin: 14px 0 6px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px;
          border: 1px solid #ccd; border-radius: 8px; }
  button { margin-top: 20px; width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
           color: #fff; background: #4361ee; border: none; border-radius: 8px; cursor: pointer; }
  button:hover { background: #3650c8; }
  .result { margin-top: 22px; padding: 16px; background: #eef2ff; border-radius: 8px; display: none; }
  .result.show { display: block; }
  .row { display: flex; justify-content: space-between; font-size: 16px; margin: 6px 0; }
  .row.total { font-weight: 700; font-size: 18px; border-top: 1px solid #cdd; padding-top: 8px; }
  .error { margin-top: 16px; color: #c0392b; font-size: 14px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>Tip Calculator</h1>
    <label for="bill">Bill amount</label>
    <input id="bill" type="number" min="0" step="0.01" placeholder="0.00">
    <label for="tip">Tip percent (%)</label>
    <input id="tip" type="number" min="0" max="100" step="1" placeholder="15">
    <button id="calc">Calculate</button>
    <div class="error" id="error"></div>
    <div class="result" id="result">
      <div class="row"><span>Tip</span><span id="tipAmount">$0.00</span></div>
      <div class="row total"><span>Total</span><span id="totalAmount">$0.00</span></div>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  function fmt(n) { return "$" + Number(n).toFixed(2); }

  async function calculate() {
    const error = $("error");
    const result = $("result");
    error.classList.remove("show");
    result.classList.remove("show");

    const bill = parseFloat($("bill").value);
    const tip_percent = parseFloat($("tip").value);

    try {
      const resp = await fetch("/api/tip", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          bill: isNaN(bill) ? null : bill,
          tip_percent: isNaN(tip_percent) ? null : tip_percent
        })
      });
      const data = await resp.json();
      if (!resp.ok) {
        error.textContent = data.error || "Calculation failed";
        error.classList.add("show");
        return;
      }
      $("tipAmount").textContent = fmt(data.tip);
      $("totalAmount").textContent = fmt(data.total);
      result.classList.add("show");
    } catch (e) {
      error.textContent = "Network error";
      error.classList.add("show");
    }
  }

  $("calc").addEventListener("click", calculate);
</script>
</body>
</html>
