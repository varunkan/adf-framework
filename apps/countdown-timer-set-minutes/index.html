<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown Timer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(30, 41, 59, 0.85);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  h1 { margin: 0 0 24px; font-weight: 600; font-size: 1.4rem; color: #cbd5e1; }
  .display {
    font-size: 6rem;
    font-weight: 700;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
    margin: 10px 0 30px;
    color: #38bdf8;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
  }
  .display.done { color: #f87171; text-shadow: 0 0 20px rgba(248,113,113,0.5); }
  .inputs {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .field { display: flex; flex-direction: column; align-items: center; }
  .field label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
  .field input {
    width: 90px;
    padding: 10px;
    font-size: 1.4rem;
    text-align: center;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
  }
  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
    color: #fff;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #setBtn { background: #6366f1; }
  #startBtn { background: #22c55e; }
  #pauseBtn { background: #f59e0b; }
  #resetBtn { background: #ef4444; }
  #finishBtn { background: #8b5cf6; }
  .msg { margin-top: 16px; min-height: 20px; font-size: 0.9rem; color: #f87171; }
  .section-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #64748b;
    margin: 22px 0 8px;
  }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip {
    padding: 8px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid #334155;
    border-radius: 999px;
    background: #1e293b;
    color: #cbd5e1;
    cursor: pointer;
  }
  .chip:hover { background: #334155; color: #f1f5f9; }
  .chip.adjust { background: #0e7490; border-color: #0e7490; color: #ecfeff; }
  .chip.adjust.sub { background: #7c2d12; border-color: #7c2d12; }
  .progress {
    height: 8px;
    width: 100%;
    background: #1e293b;
    border-radius: 999px;
    overflow: hidden;
    margin: 8px 0 4px;
  }
  .progress > div {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    transition: width .3s ease;
  }
  .history {
    margin-top: 8px;
    text-align: left;
    max-height: 140px;
    overflow-y: auto;
    font-size: 0.85rem;
    color: #94a3b8;
  }
  .history .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 4px;
    border-bottom: 1px solid #1e293b;
  }
  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #clearHistoryBtn {
    background: transparent;
    color: #f87171;
    padding: 4px 10px;
    font-size: 0.8rem;
    border: 1px solid #7f1d1d;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Countdown Timer</h1>
    <div id="display" class="display" role="timer" aria-label="Time remaining" aria-atomic="true">05:00</div>
    <div class="progress" role="progressbar" aria-label="Elapsed progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progressBar"></div>
    </div>
    <div class="inputs">
      <div class="field">
        <label for="minutes">Minutes (0–60)</label>
        <input id="minutes" type="number" min="0" max="60" value="5">
      </div>
      <div class="field">
        <label for="seconds">Seconds (0–59)</label>
        <input id="seconds" type="number" min="0" max="59" value="0">
      </div>
      <div class="field">
        <label for="repeat">Repeat (0–99)</label>
        <input id="repeat" type="number" min="0" max="99" value="0">
      </div>
    </div>
    <div class="buttons">
      <button id="setBtn">Set</button>
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <button id="finishBtn">Skip</button>
    </div>
    <div id="msg" class="msg" role="alert" aria-live="assertive"></div>

    <div class="section-label">Quick set</div>
    <div id="presets" class="chips" aria-label="Preset durations"></div>
    <div class="chips" style="margin-top:10px;">
      <input id="presetLabel" type="text" placeholder="Save current as…"
             aria-label="New preset name"
             style="flex:1;min-width:120px;padding:8px 12px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:0.85rem;">
      <button id="savePresetBtn" class="chip">Save</button>
    </div>

    <div class="section-label">Adjust running time</div>
    <div class="chips" aria-label="Adjust remaining time">
      <button class="chip adjust" data-add="60">+1:00</button>
      <button class="chip adjust" data-add="30">+0:30</button>
      <button class="chip adjust sub" data-add="-30">-0:30</button>
    </div>

    <div class="section-label history-head">
      <span>Completed sessions (<span id="completedCount">0</span>)</span>
      <span>
        <a id="exportCsv" href="/api/timer/history.csv"
           style="color:#38bdf8;font-size:0.8rem;text-decoration:none;margin-right:8px;">Export CSV</a>
        <button id="clearHistoryBtn">Clear</button>
      </span>
    </div>
    <div id="history" class="history" aria-live="polite"></div>

    <div class="section-label">Stats</div>
    <div id="stats" class="history" aria-live="polite" style="max-height:none;"></div>

    <div class="section-label">Focus goal</div>
    <div class="chips" style="margin-top:0;">
      <input id="goalMinutes" type="number" min="1" placeholder="min"
             aria-label="Focus goal in minutes"
             style="width:90px;padding:8px 12px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:0.85rem;">
      <button id="setGoalBtn" class="chip">Set goal</button>
      <button id="clearGoalBtn" class="chip">Clear</button>
    </div>
    <div class="progress" role="progressbar" aria-label="Focus goal progress"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="margin-top:10px;">
      <div id="goalBar" style="background:#22c55e;"></div>
    </div>
    <div id="goal" class="history" aria-live="polite" style="max-height:none;"></div>
  </div>

<script>
const display = document.getElementById('display');
const msg = document.getElementById('msg');
const minutesInput = document.getElementById('minutes');
const secondsInput = document.getElementById('seconds');
const progressBar = document.getElementById('progressBar');
const progressEl = progressBar.parentElement;
const presetsEl = document.getElementById('presets');
const historyEl = document.getElementById('history');
const completedCountEl = document.getElementById('completedCount');
const repeatInput = document.getElementById('repeat');
const statsEl = document.getElementById('stats');
const presetLabelInput = document.getElementById('presetLabel');
const goalEl = document.getElementById('goal');
const goalBar = document.getElementById('goalBar');
const goalMinutesInput = document.getElementById('goalMinutes');
let ticker = null;
let lastCompleted = 0;

function fmt(total) {
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function render(state) {
  const done = state.remaining === 0;
  // Prefer the server-formatted clock (handles hh:mm:ss past an hour).
  display.textContent = state.formatted || fmt(state.remaining);
  display.classList.toggle('done', done);
  // Convey state non-visually (not by color alone) for screen readers.
  display.setAttribute('aria-label', done ? 'Time is up' : 'Time remaining ' + (state.formatted || fmt(state.remaining)));
  const pct = typeof state.percent === 'number' ? state.percent : 0;
  progressBar.style.width = pct + '%';
  progressEl.setAttribute('aria-valuenow', String(pct));
  manageTicker(state.running);
  // A session just completed — refresh the log.
  if (typeof state.completed === 'number' && state.completed !== lastCompleted) {
    lastCompleted = state.completed;
    loadHistory();
  }
}

async function loadPresets() {
  const r = await api('/api/timer/presets');
  if (!r.ok || !r.data.presets) return;
  presetsEl.innerHTML = '';
  r.data.presets.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'chip';
    const star = p.favorite ? '★ ' : '';
    b.textContent = star + (p.custom ? p.label + ' ×' : p.label);
    b.title = (p.custom ? 'Click to apply. Shift-click to delete. ' : 'Click to apply. ')
            + 'Alt-click to ' + (p.favorite ? 'unfavorite.' : 'favorite.');
    b.addEventListener('click', async (ev) => {
      msg.textContent = '';
      // Alt-click pins/unpins the preset as a favorite.
      if (ev.altKey) {
        await api('/api/timer/presets/' + encodeURIComponent(p.name) + '/favorite',
                  { method: 'POST' });
        loadPresets();
        return;
      }
      // Shift-click removes a custom preset.
      if (p.custom && ev.shiftKey) {
        await api('/api/timer/presets/' + encodeURIComponent(p.name), { method: 'DELETE' });
        loadPresets();
        return;
      }
      const res = await api('/api/timer/preset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: p.name })
      });
      if (res.ok) {
        minutesInput.value = res.data.minutes;
        secondsInput.value = res.data.seconds;
        repeatInput.value = res.data.repeat || 0;
        render(res.data);
      }
    });
    presetsEl.appendChild(b);
  });
}

async function loadStats() {
  const r = await api('/api/timer/stats');
  if (!r.ok) return;
  const d = r.data;
  statsEl.innerHTML = '';
  const rows = [
    ['Sessions', String(d.sessions)],
    ['Total time', d.total_formatted],
    ['Longest', d.longest_formatted],
    ['Shortest', d.shortest_formatted],
    ['Average', d.average_formatted],
    ['Median', d.median_formatted],
  ];
  rows.forEach(([k, v]) => {
    const row = document.createElement('div');
    row.className = 'row';
    const a = document.createElement('span'); a.textContent = k;
    const b = document.createElement('span'); b.textContent = v;
    row.appendChild(a); row.appendChild(b);
    statsEl.appendChild(row);
  });
}

async function loadHistory() {
  const r = await api('/api/timer/history');
  if (!r.ok) return;
  lastCompleted = r.data.completed;
  completedCountEl.textContent = r.data.completed;
  historyEl.innerHTML = '';
  r.data.history.slice().reverse().forEach((h) => {
    const row = document.createElement('div');
    row.className = 'row';
    const name = document.createElement('span');
    name.textContent = h.label || 'Timer #' + h.sequence;
    name.title = 'Click to rename this session';
    name.style.cursor = 'pointer';
    // Click a session name to relabel it in place.
    name.addEventListener('click', async () => {
      const next = prompt('Rename session', h.label || '');
      if (next === null) return;
      const res = await api('/api/timer/history/' + h.sequence, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: next })
      });
      if (res.ok) loadHistory();
    });
    const right = document.createElement('span');
    const dur = document.createElement('span');
    dur.textContent = fmt(h.total);
    const del = document.createElement('button');
    del.textContent = '×';
    del.title = 'Delete this session';
    del.style.cssText = 'background:transparent;color:#f87171;border:none;'
                      + 'cursor:pointer;font-size:1rem;padding:0 0 0 10px;';
    del.addEventListener('click', async () => {
      const res = await api('/api/timer/history/' + h.sequence, { method: 'DELETE' });
      if (res.ok) loadHistory();
    });
    right.appendChild(dur);
    right.appendChild(del);
    row.appendChild(name);
    row.appendChild(right);
    historyEl.appendChild(row);
  });
  loadStats();
  loadGoal();
}

async function loadGoal() {
  const r = await api('/api/timer/goal');
  if (!r.ok) return;
  const d = r.data;
  const pct = Math.min(100, d.percent || 0);
  goalBar.style.width = pct + '%';
  goalBar.parentElement.setAttribute('aria-valuenow', String(pct));
  goalEl.innerHTML = '';
  if (!d.target) {
    goalEl.textContent = 'No goal set.';
    return;
  }
  const rows = [
    ['Goal', d.target_formatted],
    ['Focused', d.achieved_formatted],
    [d.met ? 'Status' : 'Remaining', d.met ? 'Goal met 🎉' : d.remaining_formatted],
  ];
  rows.forEach(([k, v]) => {
    const row = document.createElement('div');
    row.className = 'row';
    const a = document.createElement('span'); a.textContent = k;
    const b = document.createElement('span'); b.textContent = v;
    row.appendChild(a); row.appendChild(b);
    goalEl.appendChild(row);
  });
}

function manageTicker(running) {
  if (running && !ticker) {
    ticker = setInterval(doTick, 1000);
  } else if (!running && ticker) {
    clearInterval(ticker);
    ticker = null;
  }
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}

async function loadState() {
  const r = await api('/api/timer');
  if (r.ok) render(r.data);
}

async function doTick() {
  await postAndRender('/api/timer/tick');
}

// Shared helper: POST to a control endpoint and render the returned state.
// Used by tick/start/pause/reset so the fetch+render flow lives in one place.
async function postAndRender(path) {
  const r = await api(path, { method: 'POST' });
  if (r.ok) render(r.data);
  return r;
}

document.getElementById('setBtn').addEventListener('click', async () => {
  msg.textContent = '';
  const body = {
    minutes: Number(minutesInput.value),
    seconds: Number(secondsInput.value),
    repeat: Number(repeatInput.value) || 0
  };
  const r = await api('/api/timer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (r.ok) {
    render(r.data);
  } else {
    msg.textContent = r.data.error || 'Invalid input';
  }
});

document.getElementById('startBtn').addEventListener('click', async () => {
  msg.textContent = '';
  await postAndRender('/api/timer/start');
});

document.getElementById('pauseBtn').addEventListener('click', async () => {
  await postAndRender('/api/timer/pause');
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  msg.textContent = '';
  await postAndRender('/api/timer/reset');
});

// Skip-to-end: complete the current cycle immediately.
document.getElementById('finishBtn').addEventListener('click', async () => {
  msg.textContent = '';
  const r = await postAndRender('/api/timer/finish');
  if (!r.ok) msg.textContent = r.data.error || 'Nothing to skip';
});

// Add / subtract running time via the existing /api/timer/add endpoint.
document.querySelectorAll('[data-add]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    msg.textContent = '';
    const r = await api('/api/timer/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seconds: Number(btn.getAttribute('data-add')) })
    });
    if (r.ok) {
      render(r.data);
    } else {
      msg.textContent = r.data.error || 'Could not adjust time';
    }
  });
});

document.getElementById('savePresetBtn').addEventListener('click', async () => {
  msg.textContent = '';
  const label = presetLabelInput.value.trim();
  if (!label) { msg.textContent = 'Enter a preset name'; return; }
  const seconds = Number(minutesInput.value) * 60 + Number(secondsInput.value);
  const name = label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const r = await api('/api/timer/presets', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name || label, label: label, seconds: seconds })
  });
  if (r.ok) {
    presetLabelInput.value = '';
    loadPresets();
  } else {
    msg.textContent = r.data.error || 'Could not save preset';
  }
});

document.getElementById('clearHistoryBtn').addEventListener('click', async () => {
  const r = await api('/api/timer/history', { method: 'DELETE' });
  if (r.ok) {
    lastCompleted = 0;
    loadHistory();
  }
});

document.getElementById('setGoalBtn').addEventListener('click', async () => {
  msg.textContent = '';
  const seconds = Math.round(Number(goalMinutesInput.value) * 60);
  if (!seconds || seconds < 1) { msg.textContent = 'Enter goal minutes'; return; }
  const r = await api('/api/timer/goal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ seconds: seconds })
  });
  if (r.ok) {
    goalMinutesInput.value = '';
    loadGoal();
  } else {
    msg.textContent = r.data.error || 'Could not set goal';
  }
});

document.getElementById('clearGoalBtn').addEventListener('click', async () => {
  const r = await api('/api/timer/goal', { method: 'DELETE' });
  if (r.ok) loadGoal();
});

loadState();
loadPresets();
loadHistory();
loadStats();
loadGoal();
</script>
</body>
</html>
