<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown Timer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(30, 41, 59, 0.85);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 480px;
    text-align: center;
  }
  h1 { margin: 0 0 24px; font-weight: 600; font-size: 1.4rem; color: #cbd5e1; }
  .display {
    font-size: 6rem;
    font-weight: 700;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
    margin: 10px 0 30px;
    color: #38bdf8;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
  }
  .display.done { color: #f87171; text-shadow: 0 0 20px rgba(248,113,113,0.5); }
  .inputs {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .field { display: flex; flex-direction: column; align-items: center; }
  .field label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
  .field input {
    width: 90px;
    padding: 10px;
    font-size: 1.4rem;
    text-align: center;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
  }
  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
    color: #fff;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #setBtn { background: #6366f1; }
  #startBtn { background: #22c55e; }
  #pauseBtn { background: #f59e0b; }
  #resetBtn { background: #ef4444; }
  .msg { margin-top: 16px; min-height: 20px; font-size: 0.9rem; color: #f87171; }
</style>
</head>
<body>
  <div class="card">
    <h1>Countdown Timer</h1>
    <div id="display" class="display">05:00</div>
    <div class="inputs">
      <div class="field">
        <label for="minutes">Minutes (0–60)</label>
        <input id="minutes" type="number" min="0" max="60" value="5">
      </div>
      <div class="field">
        <label for="seconds">Seconds (0–59)</label>
        <input id="seconds" type="number" min="0" max="59" value="0">
      </div>
    </div>
    <div class="buttons">
      <button id="setBtn">Set</button>
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

<script>
const display = document.getElementById('display');
const msg = document.getElementById('msg');
const minutesInput = document.getElementById('minutes');
const secondsInput = document.getElementById('seconds');
let ticker = null;

function fmt(total) {
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function render(state) {
  display.textContent = fmt(state.remaining);
  display.classList.toggle('done', state.remaining === 0);
  manageTicker(state.running);
}

function manageTicker(running) {
  if (running && !ticker) {
    ticker = setInterval(doTick, 1000);
  } else if (!running && ticker) {
    clearInterval(ticker);
    ticker = null;
  }
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}

async function loadState() {
  const r = await api('/api/timer');
  if (r.ok) render(r.data);
}

async function doTick() {
  const r = await api('/api/timer/tick', { method: 'POST' });
  if (r.ok) render(r.data);
}

document.getElementById('setBtn').addEventListener('click', async () => {
  msg.textContent = '';
  const body = {
    minutes: Number(minutesInput.value),
    seconds: Number(secondsInput.value)
  };
  const r = await api('/api/timer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (r.ok) {
    render(r.data);
  } else {
    msg.textContent = r.data.error || 'Invalid input';
  }
});

document.getElementById('startBtn').addEventListener('click', async () => {
  msg.textContent = '';
  const r = await api('/api/timer/start', { method: 'POST' });
  if (r.ok) render(r.data);
});

document.getElementById('pauseBtn').addEventListener('click', async () => {
  const r = await api('/api/timer/pause', { method: 'POST' });
  if (r.ok) render(r.data);
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  msg.textContent = '';
  const r = await api('/api/timer/reset', { method: 'POST' });
  if (r.ok) render(r.data);
});

loadState();
</script>
</body>
</html>
