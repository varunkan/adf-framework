services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ands
      POSTGRES_PASSWORD: ands
      POSTGRES_DB: ands
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ands -d ands"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: andsminio
      MINIO_ROOT_PASSWORD: andsminio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: production/backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://ands:ands@postgres:5432/ands
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ands-packages
      S3_ACCESS_KEY: andsminio
      S3_SECRET_KEY: andsminio-secret
      CORS_ORIGINS: http://localhost:3000
      ESG_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: production/backend/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://ands:ands@postgres:5432/ands
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ands-packages
      S3_ACCESS_KEY: andsminio
      S3_SECRET_KEY: andsminio-secret
      ESG_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
