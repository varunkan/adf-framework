<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    min-height: 100vh;
    color: #1f2937;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 560px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 32px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.sub { margin: 0 0 24px; color: #6b7280; font-size: 14px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=url], input[type=text] {
    flex: 1 1 240px;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #4f46e5; }
  button:disabled { background: #a5b4fc; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 14px; min-height: 18px; }
  .msg.error { color: #dc2626; }
  .result {
    margin-top: 18px;
    padding: 16px;
    background: #f3f4f6;
    border-radius: 10px;
    display: none;
  }
  .result.show { display: block; }
  .result a {
    color: #4f46e5;
    font-weight: 600;
    word-break: break-all;
    text-decoration: none;
  }
  .result a:hover { text-decoration: underline; }
  .copy {
    margin-left: 8px;
    background: #10b981;
    padding: 6px 12px;
    font-size: 13px;
  }
  .copy:hover { background: #059669; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .listhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .listactions { display: flex; gap: 8px; }
  .exportbtn, .purgebtn { padding: 6px 12px; font-size: 12px; }
  .purgebtn { background: #f59e0b; }
  .purgebtn:hover { background: #d97706; }
  ul.list li .meta { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  ul.list li .title { font-weight: 600; color: #111827; }
  ul.list li .reset { background: #6b7280; padding: 4px 10px; font-size: 12px; }
  ul.list li .reset:hover { background: #4b5563; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    align-items: center;
  }
  ul.list li .short { font-weight: 600; color: #4f46e5; }
  ul.list li .orig { color: #6b7280; word-break: break-all; flex: 1; }
  ul.list li .clicks {
    font-size: 12px;
    color: #6b7280;
    background: #eef2ff;
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  ul.list li .del {
    background: #ef4444;
    padding: 4px 10px;
    font-size: 12px;
  }
  ul.list li .del:hover { background: #dc2626; }
  ul.list li .disable, ul.list li .enable {
    padding: 4px 10px;
    font-size: 12px;
  }
  ul.list li .disable { background: #f59e0b; }
  ul.list li .disable:hover { background: #d97706; }
  ul.list li .enable { background: #10b981; }
  ul.list li .enable:hover { background: #059669; }
  ul.list li .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  ul.list li .tag {
    font-size: 11px;
    color: #3730a3;
    background: #e0e7ff;
    border-radius: 999px;
    padding: 1px 8px;
  }
  .opts {
    flex: 1 1 100%;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .opts .field { flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; }
  .opts label { font-size: 12px; color: #6b7280; }
  #search {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }
  #search:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔗 URL Shortener</h1>
    <p class="sub">Paste a long URL and get a short, shareable link.</p>
    <form id="form">
      <label class="sr-only" for="url">URL to shorten</label>
      <input type="url" id="url" name="url" placeholder="https://example.com/very/long/path"
             autocomplete="off" aria-describedby="msg" />
      <button type="submit" id="submitBtn">Shorten</button>
      <div class="opts">
        <span class="field">
          <label for="alias">Custom alias (optional)</label>
          <input type="text" id="alias" name="alias" placeholder="my-link"
                 autocomplete="off" />
        </span>
        <span class="field">
          <label for="expires">Expires in seconds (optional)</label>
          <input type="number" id="expires" name="expires" placeholder="3600"
                 min="1" autocomplete="off" />
        </span>
        <span class="field">
          <label for="title">Title / label (optional)</label>
          <input type="text" id="title" name="title" placeholder="My homepage"
                 maxlength="200" autocomplete="off" />
        </span>
        <span class="field">
          <label for="maxClicks">Max clicks (optional)</label>
          <input type="number" id="maxClicks" name="maxClicks" placeholder="100"
                 min="1" autocomplete="off" />
        </span>
        <span class="field">
          <label for="tags">Tags, comma-separated (optional)</label>
          <input type="text" id="tags" name="tags" placeholder="work, personal"
                 autocomplete="off" />
        </span>
      </div>
    </form>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="result" id="result">
      <span>Short URL: </span>
      <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
      <button type="button" class="copy" id="copyBtn">Copy</button>
    </div>

    <div class="listhead">
      <h2>Recent links</h2>
      <span class="listactions">
        <button type="button" class="exportbtn" id="exportBtn">Export CSV</button>
        <button type="button" class="purgebtn" id="purgeBtn">Purge expired</button>
      </span>
    </div>
    <label class="sr-only" for="search">Search links</label>
    <input type="search" id="search" placeholder="Search by code or URL…"
           autocomplete="off" />
    <ul class="list" id="list"></ul>
  </div>

<script>
const form = document.getElementById('form');
const urlInput = document.getElementById('url');
const msg = document.getElementById('msg');
const result = document.getElementById('result');
const shortLink = document.getElementById('shortLink');
const copyBtn = document.getElementById('copyBtn');
const submitBtn = document.getElementById('submitBtn');
const list = document.getElementById('list');
const aliasInput = document.getElementById('alias');
const expiresInput = document.getElementById('expires');
const titleInput = document.getElementById('title');
const maxClicksInput = document.getElementById('maxClicks');
const tagsInput = document.getElementById('tags');
const searchInput = document.getElementById('search');
const exportBtn = document.getElementById('exportBtn');
const purgeBtn = document.getElementById('purgeBtn');

function setMsg(text, isError) {
  msg.textContent = text || '';
  msg.className = 'msg' + (isError ? ' error' : '');
}

async function loadList(term) {
  try {
    const q = term ? ('?q=' + encodeURIComponent(term)) : '';
    const res = await fetch('/api/urls' + q);
    if (!res.ok) return;
    const data = await res.json();
    list.innerHTML = '';
    data.items.slice().reverse().forEach(item => {
      const li = document.createElement('li');
      const short = window.location.origin + '/' + item.code;
      const clicks = item.clicks || 0;
      const titleHtml = item.title
        ? '<span class="title">' + escapeHtml(item.title) + '</span>' : '';
      const tagsHtml = (item.tags && item.tags.length)
        ? '<span class="tags">' + item.tags.map(t =>
            '<span class="tag">' + escapeHtml(t) + '</span>').join('') + '</span>'
        : '';
      let statusHtml = '';
      if (item.expired) statusHtml = ' (expired)';
      else if (item.exhausted) statusHtml = ' (exhausted)';
      else if (item.active === false) statusHtml = ' (disabled)';
      const clicksLabel = item.max_clicks
        ? (clicks + ' / ' + item.max_clicks + ' clicks')
        : (clicks + ' clicks');
      const code = escapeHtml(item.code);
      const toggle = (item.active === false)
        ? '<button type="button" class="enable" data-code="' + code + '">Enable</button>'
        : '<button type="button" class="disable" data-code="' + code + '">Disable</button>';
      li.innerHTML =
        '<span class="meta">' + titleHtml +
        '<a class="short" href="' + short + '" target="_blank" rel="noopener">/' +
        code + '</a>' +
        '<span class="orig">' + escapeHtml(item.url) + statusHtml + '</span>' +
        tagsHtml + '</span>' +
        '<span class="clicks">' + clicksLabel + '</span>' +
        toggle +
        '<button type="button" class="reset" data-code="' + code + '">Reset</button>' +
        '<button type="button" class="del" data-code="' + code + '">Delete</button>';
      list.appendChild(li);
    });
  } catch (e) { /* ignore */ }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  setMsg('');
  result.classList.remove('show');
  const url = urlInput.value.trim();
  if (!url) { setMsg('Please enter a URL.', true); return; }
  const body = { url };
  if (aliasInput.value.trim()) body.custom = aliasInput.value.trim();
  if (expiresInput.value.trim()) body.expires_in = expiresInput.value.trim();
  if (titleInput.value.trim()) body.title = titleInput.value.trim();
  if (maxClicksInput.value.trim()) body.max_clicks = maxClicksInput.value.trim();
  if (tagsInput.value.trim()) body.tags = tagsInput.value.trim();
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/shorten', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) {
      setMsg(data.error || 'Something went wrong.', true);
    } else {
      const shortUrl = window.location.origin + '/' + data.code;
      shortLink.textContent = shortUrl;
      shortLink.href = shortUrl;
      result.classList.add('show');
      setMsg('Done!', false);
      urlInput.value = '';
      aliasInput.value = '';
      expiresInput.value = '';
      titleInput.value = '';
      maxClicksInput.value = '';
      tagsInput.value = '';
      loadList(searchInput.value.trim());
    }
  } catch (err) {
    setMsg('Network error.', true);
  } finally {
    submitBtn.disabled = false;
  }
});

list.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-code]');
  if (!btn) return;
  const code = btn.getAttribute('data-code');
  try {
    if (btn.classList.contains('del')) {
      await fetch('/api/urls/' + encodeURIComponent(code), { method: 'DELETE' });
    } else if (btn.classList.contains('reset')) {
      await fetch('/api/urls/' + encodeURIComponent(code) + '/reset', { method: 'POST' });
    } else if (btn.classList.contains('disable')) {
      await fetch('/api/urls/' + encodeURIComponent(code) + '/disable', { method: 'POST' });
    } else if (btn.classList.contains('enable')) {
      await fetch('/api/urls/' + encodeURIComponent(code) + '/enable', { method: 'POST' });
    }
    loadList(searchInput.value.trim());
  } catch (err) { /* ignore */ }
});

let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadList(searchInput.value.trim()), 200);
});

exportBtn.addEventListener('click', () => {
  window.location.href = '/api/export';
});

purgeBtn.addEventListener('click', async () => {
  try {
    const res = await fetch('/api/expired', { method: 'DELETE' });
    const data = await res.json();
    setMsg('Purged ' + (data.purged || 0) + ' expired link(s).', false);
    loadList(searchInput.value.trim());
  } catch (err) { setMsg('Network error.', true); }
});

copyBtn.addEventListener('click', () => {
  const text = shortLink.textContent;
  if (!text) return;
  navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = 'Copy', 1500);
  });
});

loadList();
</script>
</body>
</html>
